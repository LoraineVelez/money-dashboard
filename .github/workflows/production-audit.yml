name: Production audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build stable production assets
        run: |
          node scripts/build-static-data.cjs
          node scripts/build-app.cjs
      - name: Reconcile financial data
        run: node scripts/audit-data.cjs
      - name: Syntax check active app
        run: node --check app.js
      - name: Commit generated production assets
        run: |
          if [ -z "$(git status --porcelain -- data-static.js app.js)" ]; then exit 0; fi
          git config user.name "dashboard-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-static.js app.js
          git commit -m "Generate audited production assets"
          git push
