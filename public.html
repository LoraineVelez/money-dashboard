<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>My Money Dashboard · View only</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f6f2}.bar{height:42px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;background:#203a36;color:#f4fbf8;font-size:13px;font-weight:700;letter-spacing:.01em;border-bottom:1px solid rgba(255,255,255,.12)}.dot{width:8px;height:8px;border-radius:50%;background:#58b9ae;box-shadow:0 0 0 4px rgba(88,185,174,.14)}iframe{display:block;width:100%;height:calc(100% - 42px);border:0;background:#f8f6f2}@media(max-width:520px){.bar{height:38px;font-size:12px}iframe{height:calc(100% - 38px)}}
</style>
</head>
<body>
<div class="bar"><span class="dot" aria-hidden="true"></span>View only · changes are disabled</div>
<iframe id="dashboard" src="./" title="My Money Dashboard read-only view"></iframe>
<script>
(function(){
 const frame=document.getElementById('dashboard');
 frame.addEventListener('load',()=>{
   const win=frame.contentWindow,doc=frame.contentDocument;
   if(!win||!doc)return;
   const style=doc.createElement('style');
   style.textContent=`
     #undoBtn,#redoBtn,#saveCat,[data-delete-rule],[data-view="rules"],.paidbtn,.removebill{display:none!important}
     .editor,.scopebox{display:none!important}
     .txrow{cursor:default!important}
     .dueinput{pointer-events:none!important;opacity:.72}
   `;
   doc.head.appendChild(style);
   const blockedSelector='#undoBtn,#redoBtn,#saveCat,[data-delete-rule],[data-view="rules"],.paidbtn,.removebill,.dueinput';
   doc.addEventListener('click',e=>{
     const blocked=e.target.closest&&e.target.closest(blockedSelector);
     if(blocked){e.preventDefault();e.stopImmediatePropagation();return false;}
   },true);
   doc.addEventListener('change',e=>{
     if(e.target.matches&&e.target.matches('.dueinput')){e.preventDefault();e.stopImmediatePropagation();return false;}
   },true);
   const protect=()=>{
     doc.querySelectorAll('#undoBtn,#redoBtn,#saveCat,[data-delete-rule],.paidbtn,.removebill,.dueinput').forEach(el=>{el.disabled=true;el.setAttribute('aria-disabled','true')});
     doc.querySelectorAll('.editor,.scopebox,[data-view="rules"]').forEach(el=>el.style.display='none');
   };
   protect();
   new win.MutationObserver(protect).observe(doc.body,{childList:true,subtree:true});
 });
})();
</script>
</body>
</html>
