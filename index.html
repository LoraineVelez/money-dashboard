<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Money Dashboard</title><style>body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#fbf8f7;color:#2d2a2b}.wrap{max-width:1180px;margin:auto;padding:30px 22px 50px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}h1{margin:0;font-size:30px}.muted{color:#746d70}.tabs{display:flex;gap:8px;margin:22px 0}.tab{border:1px solid #eadfe2;background:#fff;border-radius:999px;padding:9px 15px;cursor:pointer}.tab.active{background:#2d2a2b;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#fff;border:1px solid #eadfe2;border-radius:18px;padding:17px}.label{font-size:13px;color:#746d70}.value{font-size:26px;font-weight:700;margin-top:6px}.section{margin-top:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.barrow{display:grid;grid-template-columns:150px 1fr 95px 55px;gap:10px;align-items:center;margin:10px 0}.track{height:10px;background:#f4e5e8;border-radius:999px;overflow:hidden}.fill{height:100%;background:#d8a7b1}.click{cursor:pointer}.click:hover{box-shadow:0 4px 14px rgba(80,50,60,.08);border-color:#c78998}.tablewrap{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eadfe2;text-align:left}th{position:sticky;top:0;background:#fff}.amount{text-align:right}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f4e5e8}.review{background:#fff1cf;color:#765d15}.positive{color:#55765e}.negative{color:#ad5866}select,input{font:inherit;padding:10px 12px;border:1px solid #eadfe2;border-radius:12px;background:#fff}.modal{border:0;border-radius:18px;max-width:700px;width:calc(100% - 30px);padding:0}.modal::backdrop{background:rgba(0,0,0,.35)}.modalhead{display:flex;justify-content:space-between;padding:20px;border-bottom:1px solid #eadfe2}.modalbody{padding:20px;max-height:65vh;overflow:auto}.close{border:1px solid #eadfe2;background:#fff;border-radius:999px;width:34px;height:34px}.note{font-size:12px;color:#746d70}.pie{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.legend{font-size:13px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.barrow{grid-template-columns:120px 1fr 80px}.pct{display:none}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><div><h1>My Money Dashboard</h1><div class="muted">Simple view of where my money is going.</div></div><div><span class="muted">Month </span><select id="month"></select></div></div><div class="tabs"><button class="tab active" data-view="overview">Big picture</button><button class="tab" data-view="month">Month by month</button><button class="tab" data-view="transactions">Transactions</button><button class="tab" data-view="accounts">Accounts</button></div><div id="app">Loading dashboard…</div></main><dialog id="modal" class="modal"><div class="modalhead"><div><div class="label" id="modalSub"></div><h2 id="modalTitle" style="margin:0"></h2></div><button class="close" onclick="modal.close()">×</button></div><div class="modalbody" id="modalBody"></div></dialog><script src="pack-0.js"></script><script src="pack-1.js"></script><script src="pack-2.js"></script><script>const DATA=JSON.parse(window.MONEY_PARTS.join('')),D=DATA.months,O=DATA.order,S=DATA.dict.s,C=DATA.dict.c,A=DATA.dict.a,M=DATA.dict.m,latest=O[O.length-1],sel=document.getElementById('month'),modal=document.getElementById('modal');const ROTH=[['Nov 30, 2025',13668.75],['Dec 31, 2025',13688.39],['Jan 31, 2026',14004.43],['Feb 28, 2026',14140.20],['Mar 31, 2026',13405.30],['Apr 30, 2026',14591.68],['May 31, 2026',15254.19],['Jun 30, 2026',15300.03],['Jul 31, 2026',15080.31]],K401=[['Dec 31, 2025',4061.56],['Mar 31, 2026',7069.06],['Jun 30, 2026',8708.28]];O.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=D[k].label;sel.appendChild(o)});sel.value=latest;let view='overview';const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0),fmt2=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);function txObj(k,t){return{date:`${k}-${String(t[0]).padStart(2,'0')}`,account:A[t[1]],source:S[t[2]],amount:t[3],category:C[t[4]],major:M[t[5]],direct:!!t[6],review:!!t[7]}}function allTx(k){return D[k].tx.map(t=>txObj(k,t))}function key(t){return 'cat:'+t.date+'|'+t.account+'|'+t.amount+'|'+t.source}const cats=['Housing','Food & Dining','Shopping','Transportation','Bills & Utilities','Subscriptions & Digital','Home','Entertainment','Health','Travel','Gifts','Personal Care','Education','Savings / Investing','Debt Payment','Other','Needs Review'];function eff(t){return localStorage.getItem(key(t))||t.category}function p2p(t){return /VENMO|ZELLE|CASH APP|APPLE CASH|P2P|PERSON-TO-PERSON/i.test(t.source)}function ambiguous(t){let c=eff(t);return c==='Needs Review'||['Other Spending','External Transfer','External Transfer / Deposit','Other Deposit'].includes(c)||(p2p(t)&&['Person-to-Person','Other Spending','External Transfer'].includes(c))}function source(t){let x=t.source.replace(/^Debit Card\s+/i,'').replace(/^Adjustment\s+/i,'');const rules=[[/AMAZON|AMZN/i,'Amazon'],[/UBER\s*EATS/i,'Uber Eats'],[/\bUBER\b/i,'Uber'],[/TARGET/i,'Target'],[/WAWA/i,'Wawa'],[/APPLE\.COM|APPLE CASH|\bAPPLE\b/i,'Apple'],[/VENMO/i,'Venmo'],[/ZELLE/i,'Zelle'],[/PAYPAL/i,'PayPal'],[/PECO/i,'PECO'],[/T-MOBILE/i,'T-Mobile'],[/ROCKET MONEY/i,'Rocket Money'],[/HOMEAGLO/i,'Homeaglow'],[/NETFLIX/i,'Netflix'],[/SPOTIFY/i,'Spotify'],[/ADOBE/i,'Adobe'],[/CANVA/i,'Canva'],[/GOOGLE/i,'Google']];for(const [r,n] of rules)if(r.test(x))return n;return x.length>58?x.slice(0,55)+'…':x}function card(l,v,n='',act=''){return `<div class="card ${act?'click':''}" ${act?`data-act="${act}"`:''}><div class="label">${l}${act?' · click to verify':''}</div><div class="value">${v}</div>${n?`<div class="note">${n}</div>`:''}</div>`}function trend(){let a=O.map(k=>D[k].end),W=760,H=240,p=42,min=Math.min(...a)*.93,max=Math.max(...a)*1.06,pts=a.map((v,i)=>[p+i*(W-2*p)/(a.length-1),H-p-(v-min)/(max-min)*(H-2*p)]);return `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="#d8a7b1" stroke-width="5" points="${pts.map(q=>q.join(',')).join(' ')}"/>${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="white" stroke="#d8a7b1" stroke-width="3"/><text x="${q[0]}" y="${Math.max(14,q[1]-12)}" text-anchor="middle" font-size="11" font-weight="700">${fmt(D[O[i]].end)}</text><text x="${q[0]}" y="228" text-anchor="middle" font-size="11" fill="#746d70">${D[O[i]].label.split(' ')[0]}</text>`).join('')}</svg>`}function overview(){let n=D[latest],inc=O.reduce((s,k)=>s+D[k].income,0),sp=O.reduce((s,k)=>s+D[k].spend,0);return `<div class="grid">${card('Current cash',fmt(n.end),'Checking + savings','cash')}${card('Cash growth',fmt(n.change),'In last 30 days')}${card('Income to date',fmt(inc),'Across statements provided','incomeAll')}${card('Bank spending to date',fmt(sp),'Direct bank spending','spendAll')}</div><div class="card section"><h2>Total cash balance trend</h2>${trend()}</div><div class="grid section">${card('401(k)',fmt(8708.28),'As of Jun 30, 2026','k401')}${card('Roth IRA',fmt(15080.31),'As of Jul 31, 2026','roth')}${card('Credit card debt','Not added','Need card statements')}${card('Loans','Not added','Ready for statements')}</div>`}const colors=['#c78998','#dfb6be','#ad7d8a','#e7cbd0','#b9929d','#f0dce0','#96707b','#d2a0aa','#e9bfc6','#7f5e67'];function pie(x){let e=Object.entries(x.categories).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]),tot=e.reduce((s,a)=>s+a[1],0),ang=-Math.PI/2,paths='';e.forEach(([n,v],i)=>{let a2=ang+2*Math.PI*v/tot,cx=130,cy=130,r=100,x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2),lg=a2-ang>Math.PI?1:0;paths+=`<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${lg} 1 ${x2} ${y2} Z" fill="${colors[i%colors.length]}"/>`;ang=a2});return `<div class="pie"><svg viewBox="0 0 260 260" width="300">${paths}<circle cx="130" cy="130" r="58" fill="white"/><text x="130" y="126" text-anchor="middle" font-size="12" fill="#746d70">Bank spending</text><text x="130" y="149" text-anchor="middle" font-size="18" font-weight="700">${fmt(x.spend)}</text></svg><div class="legend">${e.map(([n,v],i)=>`<div><span class="dot" style="background:${colors[i%colors.length]}"></span>${n} · ${(v/tot*100).toFixed(1)}%</div>`).join('')}</div></div>`}function monthView(){let x=D[sel.value],e=Object.entries(x.categories).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]),mx=Math.max(...e.map(a=>a[1]));return `<div class="grid">${card('Starting cash',fmt(x.start))}${card('Income in',fmt(x.income),'Every deposit','income')}${card('Bank spending',fmt(x.spend),'Every direct bank purchase','spending')}${card('Ending cash',fmt(x.end),x.change>=0?`<span class="positive">Cash increased ${fmt(Math.abs(x.change))}</span>`:`<span class="negative">Cash decreased ${fmt(Math.abs(x.change))}</span>`)}</div><div class="two section"><div class="card"><h2>Where my money went</h2>${pie(x)}</div><div class="card"><h2>Spending by category</h2>${e.map(([n,v])=>`<div class="barrow"><div>${n}</div><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><div>${fmt2(v)}</div><div class="pct muted">${(v/x.spend*100).toFixed(1)}%</div></div>`).join('')}</div></div>`}function date(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}function rows(arr){return arr.sort((a,b)=>b.date.localeCompare(a.date)).map((t,i)=>`<tr class="click tx" data-i="${i}"><td>${date(t.date)}</td><td><strong>${source(t)}</strong><div class="note">${t.source}</div></td><td><span class="pill ${ambiguous(t)?'review':''}">${ambiguous(t)?'Needs Review':eff(t)}</span></td><td>${t.account}</td><td class="amount ${t.amount<0?'negative':'positive'}">${fmt2(t.amount)}</td></tr>`).join('')}function transactions(){let arr=allTx(sel.value),rc=arr.filter(ambiguous).length;window.currentTx=arr;return `<div class="card"><div class="head"><div><h2 style="margin:0">Transactions · ${D[sel.value].label}</h2><div class="note">${arr.length} entries · <strong>${rc} need review</strong></div></div><input id="search" placeholder="Search merchant/source"></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Source / statement detail</th><th>Category</th><th>Account</th><th class="amount">Amount</th></tr></thead><tbody id="tb">${rows(arr)}</tbody></table></div></div>`}function accounts(){return `<div class="grid">${card('Regular Savings',fmt2(D[latest].endAccounts['Regular Savings']))}${card('Bright Future Savings',fmt2(D[latest].endAccounts['Bright Future Savings']))}${card('Debit Account',fmt2(D[latest].endAccounts['Debit Account']))}${card('Roth IRA',fmt2(15080.31),'Jul 31, 2026','roth')}${card('401(k)',fmt2(8708.28),'Jun 30, 2026','k401')}</div>`}function openHistory(name,data){document.getElementById('modalTitle').textContent=name;document.getElementById('modalSub').textContent='Balance history';document.getElementById('modalBody').innerHTML=`<table><thead><tr><th>Date</th><th class="amount">Balance</th></tr></thead><tbody>${data.map(r=>`<tr><td>${r[0]}</td><td class="amount">${fmt2(r[1])}</td></tr>`).join('')}</tbody></table>`;modal.showModal()}function editTx(t){document.getElementById('modalTitle').textContent=source(t);document.getElementById('modalSub').textContent=`${date(t.date)} · ${t.account} · ${fmt2(t.amount)}`;document.getElementById('modalBody').innerHTML=`<div class="label">Statement detail</div><p>${t.source}</p><div class="label">Category</div><select id="cat" style="width:100%">${cats.map(c=>`<option ${c===eff(t)?'selected':''}>${c}</option>`).join('')}</select>${ambiguous(t)?'<p class="review" style="padding:10px;border-radius:10px">This transaction needs your confirmation.</p>':''}<button id="save" style="margin-top:14px;padding:10px 14px;border:0;border-radius:10px;background:#2d2a2b;color:white">Save category</button>`;modal.showModal();document.getElementById('save').onclick=()=>{localStorage.setItem(key(t),document.getElementById('cat').value);modal.close();render()}}function details(type){let arr=[];if(type==='income')arr=allTx(sel.value).filter(t=>t.category==='Income'||t.category==='Other Income');if(type==='spending')arr=allTx(sel.value).filter(t=>t.direct&&t.amount<0);if(type==='incomeAll')arr=O.flatMap(k=>allTx(k).filter(t=>t.category==='Income'||t.category==='Other Income'));if(type==='spendAll')arr=O.flatMap(k=>allTx(k).filter(t=>t.direct&&t.amount<0));if(type==='k401')return openHistory('401(k)',K401);if(type==='roth')return openHistory('Roth IRA',ROTH);if(!arr.length)return;document.getElementById('modalTitle').textContent=type.includes('income')?'Income deposits':'Bank spending';document.getElementById('modalSub').textContent=type.includes('All')?'All statements':D[sel.value].label;let abs=type.includes('spend'),tot=arr.reduce((s,t)=>s+(abs?Math.abs(t.amount):t.amount),0);document.getElementById('modalBody').innerHTML=`<table><thead><tr><th>Date</th><th>Source</th><th>Account</th><th class="amount">Amount</th></tr></thead><tbody>${arr.sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${date(t.date)}</td><td>${source(t)}<div class="note">${t.source}</div></td><td>${t.account}</td><td class="amount">${fmt2(abs?Math.abs(t.amount):t.amount)}</td></tr>`).join('')}</tbody></table><h3 style="text-align:right">Total: ${fmt2(tot)}</h3>`;modal.showModal()}function wire(){document.querySelectorAll('[data-act]').forEach(e=>e.onclick=()=>details(e.dataset.act));document.querySelectorAll('.tx').forEach((e,i)=>e.onclick=()=>editTx(window.currentTx[i]));let q=document.getElementById('search');if(q)q.oninput=()=>{let s=q.value.toLowerCase(),a=window.currentTx.filter(t=>(t.source+' '+source(t)+' '+eff(t)).toLowerCase().includes(s));document.getElementById('tb').innerHTML=rows(a);window.currentTx=a;wire()}}function render(){document.getElementById('app').innerHTML=view==='overview'?overview():view==='month'?monthView():view==='transactions'?transactions():accounts();wire()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});sel.onchange=render;render();</script></body></html>
