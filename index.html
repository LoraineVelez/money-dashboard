<body><main class="wrap"><div class="head"><div><div class="brandline"><span class="brandmark" aria-hidden="true"></span><h1>My Money Dashboard</h1></div><div class="muted" style="margin-top:7px">Simple view of where my money is going.</div></div><div class="controls"><label class="muted" for="month">Month</label><select id="month" aria-label="Statement month"></select><button type="button" class="themebtn" id="themeToggle" aria-label="Switch color theme"><span class="themeicon" aria-hidden="true">☾</span><span class="themelabel">Dark</span></button></div></div><div class="tabs" aria-label="Dashboard sections"><button type="button" class="tab active" data-view="overview">Big picture</button><button type="button" class="tab" data-view="month">Month by month</button><button type="button" class="tab" data-view="transactions">Transactions</button><button type="button" class="tab" data-view="accounts">Accounts</button></div><div id="app" aria-live="polite">Loading dashboard…</div><div id="dataVersion" class="note" style="margin-top:16px;text-align:center"></div></main><dialog id="modal" class="modal"><div class="modalhead"><div><div class="label" id="modalSub"></div><h2 id="modalTitle" style="margin:0"></h2></div><button type="button" class="close" id="closeModal" aria-label="Close dialog">×</button></div><div class="modalbody" id="modalBody"></div></dialog>
<script>(function(){const root=document.documentElement,btn=document.getElementById('themeToggle');let saved=null;try{saved=localStorage.getItem('moneyDashboardTheme')}catch{}const preferred=saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');function setTheme(t){root.dataset.theme=t;const dark=t==='dark';btn.querySelector('.themeicon').textContent=dark?'☀':'☾';btn.querySelector('.themelabel').textContent=dark?'Light':'Dark';btn.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');try{localStorage.setItem('moneyDashboardTheme',t)}catch{}}setTheme(preferred);btn.addEventListener('click',()=>setTheme(root.dataset.theme==='dark'?'light':'dark'));})();</script>
