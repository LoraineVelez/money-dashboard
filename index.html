<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Money Dashboard</title>
<style>
:root{--bg:#fbf8f7;--card:#fff;--ink:#2d2a2b;--muted:#746d70;--rose:#d8a7b1;--rose2:#c78998;--blush:#f4e5e8;--line:#eadfe2;--green:#55765e;--red:#ad5866;--cream:#fff9ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:30px 22px 50px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{margin:0;font-size:30px;letter-spacing:-.03em}.muted{color:var(--muted)}.controls{display:flex;align-items:center;gap:10px}select,input{font:inherit;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}.tabs{display:flex;gap:8px;margin:24px 0 18px;flex-wrap:wrap}.tab{font:inherit;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 15px;cursor:pointer}.tab.active{background:var(--ink);color:white;border-color:var(--ink)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.clickable{cursor:pointer;transition:.15s}.clickable:hover{transform:translateY(-1px);border-color:var(--rose2);box-shadow:0 4px 16px rgba(90,60,70,.07)}.label{font-size:13px;color:var(--muted);margin-bottom:7px}.value{font-size:26px;font-weight:700;letter-spacing:-.03em}.note{font-size:12px;color:var(--muted);margin-top:6px}.positive{color:var(--green)}.negative{color:var(--red)}.section{margin-top:18px}.two{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}h2{font-size:18px;margin:0 0 14px}svg{width:100%;height:auto}.barrow{display:grid;grid-template-columns:150px 1fr 92px 60px;gap:10px;align-items:center;margin:10px 0;font-size:14px}.track{height:10px;border-radius:999px;background:var(--blush);overflow:hidden}.fill{height:100%;background:var(--rose);border-radius:999px}.callout{padding:14px;border-radius:14px;background:var(--cream);font-size:13px;color:#735e36}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--blush);font-size:12px}.piebox{display:flex;align-items:center;justify-content:center;min-height:330px}.pielegend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px;font-size:12px}.legenddot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.txcard{margin-top:18px}.txhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tablewrap{overflow:auto;max-height:570px;margin-top:10px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:white;color:var(--muted);z-index:1}.amount{text-align:right;white-space:nowrap}.review{background:#fff1cf;color:#765d15}.modal{border:0;border-radius:20px;padding:0;max-width:760px;width:calc(100% - 28px);box-shadow:0 25px 80px rgba(35,25,30,.25)}.modal::backdrop{background:rgba(35,25,30,.35)}.modalhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:20px 22px;border-bottom:1px solid var(--line)}.modalbody{padding:0 22px 20px;max-height:65vh;overflow:auto}.close{border:1px solid var(--line);background:white;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px}.modaltotal{display:flex;justify-content:space-between;font-weight:700;padding:14px 0;border-top:2px solid var(--ink);margin-top:4px}.accountrow{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:800px){.grid4{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.barrow{grid-template-columns:115px 1fr 80px}.pct{display:none}}@media(max-width:480px){.grid4{grid-template-columns:1fr}.value{font-size:23px}.wrap{padding:22px 14px 40px}.pielegend{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="head"><div><h1>My Money Dashboard</h1><div class="muted">Simple view of where my money is going.</div></div><div class="controls"><span class="muted">Month</span><select id="month"></select></div></div><div class="tabs"><button class="tab active" data-view="overview">Big picture</button><button class="tab" data-view="month">Month by month</button><button class="tab" data-view="transactions">Transactions</button><button class="tab" data-view="accounts">Accounts</button></div><div id="app">Loading dashboard…</div></main><dialog id="modal" class="modal"><div class="modalhead"><div><div class="label" id="modalSub"></div><h2 id="modalTitle" style="margin:0"></h2></div><button class="close" id="closeModal">×</button></div><div class="modalbody" id="modalBody"></div></dialog><script src="data-v4-0.js?v=6"></script><script src="data-v4-1.js?v=6"></script><script src="data-v4-2.js?v=6"></script><script src="data-v4-3.js?v=6"></script><script src="data-v4-4.js?v=6"></script><script src="app-part-0.js?v=6"></script><script src="app-part-1.js?v=6"></script><script src="app-part-2.js?v=6"></script><script src="app-part-3.js?v=6"></script><script src="app-part-4.js?v=6"></script><script src="app-part-5.js?v=6"></script><script src="app-part-6.js?v=6"></script><script src="app-loader.js?v=6"></script></body></html>
