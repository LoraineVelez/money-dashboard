<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Money Dashboard</title></head><body><script>(async()=>{try{const r=await fetch('/app.gz?v=2');if(!r.ok)throw new Error('Could not load dashboard');const ds=new DecompressionStream('gzip');const html=await new Response(r.body.pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="font-family:system-ui;padding:40px"><h1>My Money Dashboard</h1><p>Dashboard load error: '+e.message+'</p></div>'}})();</script></body></html>
