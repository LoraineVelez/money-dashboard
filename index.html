<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Money Dashboard</title>
<style>
:root{--bg:#fbf8f7;--card:#fff;--ink:#2d2a2b;--muted:#746d70;--rose:#d8a7b1;--rose2:#c78998;--blush:#f4e5e8;--line:#eadfe2;--green:#5B9A72;--red:#C43C7A;--cream:#fff9ef;--shadow:0 8px 28px rgba(72,47,56,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:30px 22px 50px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{margin:0;font-size:30px;letter-spacing:-.03em}h2{font-size:18px;margin:0 0 14px}.muted{color:var(--muted)}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}select,input,button{font:inherit}select,input{padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}button{cursor:pointer}.tabs{display:flex;gap:8px;margin:24px 0 18px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 15px}.tab.active{background:var(--ink);color:white;border-color:var(--ink)}.iconbtn,.smallbtn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px;color:var(--ink)}.iconbtn:disabled{opacity:.35;cursor:not-allowed}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.clickable{cursor:pointer;transition:.15s}.clickable:hover{transform:translateY(-1px);border-color:var(--rose2)}.label{font-size:13px;color:var(--muted);margin-bottom:7px}.value{font-size:26px;font-weight:750;letter-spacing:-.03em}.note{font-size:12px;color:var(--muted);margin-top:6px}.positive{color:var(--green)}.negative{color:var(--red)}.section{margin-top:18px}.two{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}svg{width:100%;height:auto}.callout{padding:14px;border-radius:14px;background:var(--cream);font-size:13px;color:#735e36}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--blush);font-size:12px}.piebox{display:flex;align-items:center;justify-content:center;min-height:320px}.pielegend{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:10px}.legendbtn{border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:10px;display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;color:var(--ink)}.legendbtn:hover{background:var(--blush)}.legenddot{display:inline-block;width:9px;height:9px;border-radius:50%}.categoryrow{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left}.categoryrow:hover{background:#fcf7f8}.summaryline{margin:14px 0 0;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:14px}.reviewbar{display:flex;justify-content:space-between;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}.reviewbtn{border:0;background:var(--blush);border-radius:999px;padding:8px 12px;color:var(--ink)}.reviewbtn strong{color:var(--red)}.progresswrap{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);min-width:300px}.progress{height:8px;flex:1;background:#f1e8ea;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:999px}.recon{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:15px 17px;border-radius:16px;border:1px solid var(--line);background:#fff}.recon.ok{border-color:#cfe1d4;background:#f8fcf9}.recon.warn{border-color:#f0cad9;background:#fff8fb}.reconnums{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.txcard{margin-top:18px}.txhead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.txfilters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.check{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:white;font-size:13px}.check input{margin:0}.tablewrap{overflow:auto;max-height:590px;margin-top:10px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:white;color:var(--muted);z-index:1}.amount{text-align:right;white-space:nowrap}.edited{display:inline-block;margin-top:5px;margin-right:5px;font-size:10px;color:var(--green);font-weight:700}.rulebadge{display:inline-block;margin-top:5px;font-size:10px;color:#815d69;background:var(--blush);padding:2px 6px;border-radius:999px}.empty{padding:28px;text-align:center;color:var(--muted)}.ruleswrap{max-height:none}.danger{color:var(--red)}.accountrow{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid var(--line)}.modal{border:0;border-radius:20px;padding:0;max-width:780px;width:calc(100% - 28px);box-shadow:0 25px 80px rgba(35,25,30,.25)}.modal::backdrop{background:rgba(35,25,30,.35)}.modalhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:20px 22px;border-bottom:1px solid var(--line)}.modalbody{padding:0 22px 20px;max-height:68vh;overflow:auto}.close{border:1px solid var(--line);background:white;border-radius:999px;width:34px;height:34px;font-size:18px}.modaltotal{display:flex;justify-content:space-between;font-weight:700;padding:14px 0;border-top:2px solid var(--ink);margin-top:4px}.editor{padding:16px 0}.editor select{width:100%;margin:5px 0 12px}.direction{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.scopebox{display:grid;gap:8px;padding:12px;background:#faf6f7;border-radius:12px;margin-top:6px}.scopebox label{font-size:13px}.scopebox .disabled{opacity:.45}.primarybtn{margin-top:16px;padding:10px 16px;border:0;border-radius:10px;background:var(--ink);color:white}.mini{grid-template-columns:repeat(4,1fr)!important;margin:12px 0}.pie-slice{transform-origin:center;transition:.12s}.pie-slice:hover{opacity:.86}
@media(max-width:800px){.grid4{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.pielegend{grid-template-columns:1fr}.progresswrap{min-width:0;flex:1}.reviewbar{align-items:flex-start;flex-direction:column}.recon{align-items:flex-start;flex-direction:column}.mini{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:520px){.grid4{grid-template-columns:1fr}.value{font-size:23px}.wrap{padding:22px 14px 40px}.controls{width:100%}.txfilters{width:100%}.txfilters input,.txfilters select{width:100%}.mini{grid-template-columns:1fr!important}}
</style></head>
<body><main class="wrap"><div class="head"><div><h1>My Money Dashboard</h1><div class="muted">Simple view of where my money is going.</div></div><div class="controls"><span class="muted">Month</span><select id="month"></select></div></div><div class="tabs"><button class="tab active" data-view="overview">Big picture</button><button class="tab" data-view="month">Month by month</button><button class="tab" data-view="transactions">Transactions</button><button class="tab" data-view="accounts">Accounts</button></div><div id="app">Loading dashboard…</div></main><dialog id="modal" class="modal"><div class="modalhead"><div><div class="label" id="modalSub"></div><h2 id="modalTitle" style="margin:0"></h2></div><button class="close" id="closeModal">×</button></div><div class="modalbody" id="modalBody"></div></dialog>

</body></html>
