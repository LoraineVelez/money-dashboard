<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loraine's Money Dashboard</title>
<style>
:root{--bg:#fbf8f7;--card:#fff;--ink:#2d2a2b;--muted:#746d70;--rose:#d8a7b1;--blush:#f4e5e8;--line:#eadfe2;--green:#55765e;--red:#ad5866;--cream:#fff9ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:30px 22px 50px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{margin:0;font-size:30px;letter-spacing:-.03em}.muted{color:var(--muted)}.controls{display:flex;align-items:center;gap:10px}select{font:inherit;padding:10px 36px 10px 13px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}.tabs{display:flex;gap:8px;margin:24px 0 18px;flex-wrap:wrap}.tab{font:inherit;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 15px;cursor:pointer}.tab.active{background:var(--ink);color:white;border-color:var(--ink)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.label{font-size:13px;color:var(--muted);margin-bottom:7px}.value{font-size:26px;font-weight:700;letter-spacing:-.03em}.note{font-size:12px;color:var(--muted);margin-top:6px}.positive{color:var(--green)}.negative{color:var(--red)}.section{margin-top:18px}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}h2{font-size:18px;margin:0 0 14px}svg{width:100%;height:auto}.barrow{display:grid;grid-template-columns:150px 1fr 92px 60px;gap:10px;align-items:center;margin:10px 0;font-size:14px}.track{height:10px;border-radius:999px;background:var(--blush);overflow:hidden}.fill{height:100%;background:var(--rose);border-radius:999px}.future{background:var(--cream)}.callout{padding:14px;border-radius:14px;background:var(--cream);font-size:13px;color:#735e36}.accountrow{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.accountrow:last-child{border-bottom:0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--blush);font-size:12px}@media(max-width:800px){.grid4{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.barrow{grid-template-columns:115px 1fr 80px}.pct{display:none}}@media(max-width:480px){.grid4{grid-template-columns:1fr}.value{font-size:23px}.wrap{padding:22px 14px 40px}}
</style>
</head>
<body><main class="wrap">
<div class="head"><div><h1>My Money Dashboard</h1><div class="muted">Simple view of where my money is going.</div></div><div class="controls"><span class="muted">Month</span><select id="month"></select></div></div>
<div class="tabs"><button class="tab active" data-view="overview">Big picture</button><button class="tab" data-view="month">Month by month</button><button class="tab" data-view="accounts">Accounts</button></div>
<div id="app"></div>
</main>
<script>
const D={
"2025-11":{"label":"Nov 2025","start":8348.48,"income":4877.16,"spend":4265.74,"cards":289,"end":7731.68,"change":-616.80,"c":{"Housing":1000,"Food & Dining":324.62,"Shopping":1114.09,"Transportation":236.16,"Bills & Utilities":158.14,"Subscriptions & Digital":103.36,"Home":122,"Entertainment":257.19,"Other":950.18}},
"2025-12":{"label":"Dec 2025","start":7731.68,"income":4877.16,"spend":6296.43,"cards":65,"end":14176.60,"change":6444.92,"c":{"Housing":2679,"Food & Dining":434.59,"Shopping":497.54,"Transportation":154.77,"Bills & Utilities":843.79,"Subscriptions & Digital":143.73,"Home":110.57,"Money Sent":120,"Entertainment":831.99,"Other":480.45}},
"2026-01":{"label":"Jan 2026","start":14176.60,"income":6139.15,"spend":3554.85,"cards":315,"end":15139.40,"change":962.80,"c":{"Housing":1000,"Food & Dining":594.76,"Shopping":527.27,"Transportation":163.41,"Bills & Utilities":249.57,"Subscriptions & Digital":192.12,"Money Sent":140,"Entertainment":155.02,"Other":532.70}},
"2026-02":{"label":"Feb 2026","start":15139.40,"income":5135.75,"spend":2498.91,"cards":423.18,"end":16775.03,"change":1635.63,"c":{"Food & Dining":326,"Shopping":669.50,"Transportation":151.19,"Bills & Utilities":679.22,"Subscriptions & Digital":96.77,"Money Sent":50,"Entertainment":132.24,"Other":393.99}},
"2026-03":{"label":"Mar 2026","start":16775.03,"income":5616.68,"spend":4971.40,"cards":700,"end":16678.03,"change":-97,"c":{"Housing":1779,"Food & Dining":338.36,"Shopping":475.72,"Transportation":262.91,"Bills & Utilities":651.46,"Subscriptions & Digital":305.12,"Money Sent":805,"Entertainment":14.57,"Other":339.26}},
"2026-04":{"label":"Apr 2026","start":16678.03,"income":5616.68,"spend":4947.89,"cards":1258.43,"end":18294.41,"change":1616.38,"c":{"Housing":885,"Food & Dining":551.37,"Shopping":802.31,"Transportation":190.59,"Bills & Utilities":610.80,"Subscriptions & Digital":139.61,"Money Sent":190,"Entertainment":490.46,"Other":1087.75}},
"2026-05":{"label":"May 2026","start":18294.41,"income":7020.85,"spend":3700.96,"cards":565,"end":20860.45,"change":2566.04,"c":{"Housing":1000,"Food & Dining":584.33,"Shopping":456.24,"Transportation":160.78,"Bills & Utilities":480.36,"Subscriptions & Digital":140.69,"Money Sent":183,"Entertainment":189.13,"Other":506.43}},
"2026-06":{"label":"Jun 2026","start":20860.45,"income":5616.68,"spend":6522.61,"cards":1521.80,"end":19868.95,"change":-991.50,"c":{"Housing":2754,"Food & Dining":353.18,"Shopping":1342.75,"Transportation":72.38,"Bills & Utilities":176.75,"Subscriptions & Digital":168.34,"Money Sent":118,"Entertainment":180.04,"Other":1357.17}},
"2026-07":{"label":"Jul 2026","start":19868.95,"income":7021.35,"spend":5295.37,"cards":1142.09,"end":24394.25,"change":4525.30,"c":{"Housing":1000,"Food & Dining":443.08,"Shopping":1120.36,"Transportation":194.20,"Bills & Utilities":127,"Subscriptions & Digital":144.87,"Money Sent":460,"Entertainment":35.22,"Other":1770.64}}
};
const order=Object.keys(D),latest=order[order.length-1],sel=document.getElementById('month');
order.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=D[k].label;sel.appendChild(o)});sel.value=latest;
let view='overview';
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0);
const fmt2=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
function card(l,v,n=''){return `<div class="card"><div class="label">${l}</div><div class="value">${v}</div>${n?`<div class="note">${n}</div>`:''}</div>`}
function trend(){const a=order.map(k=>D[k].end),W=760,H=220,p=30,min=Math.min(...a)*.92,max=Math.max(...a)*1.04,pts=a.map((v,i)=>[p+i*(W-2*p)/(a.length-1),H-p-(v-min)/(max-min)*(H-2*p)]);return `<svg viewBox="0 0 ${W} ${H}" aria-label="Cash balance trend"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#eadfe2"/><polyline fill="none" stroke="#d8a7b1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(q=>q.join(',')).join(' ')}"/>${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="white" stroke="#d8a7b1" stroke-width="3"/><text x="${q[0]}" y="212" text-anchor="middle" font-size="11" fill="#746d70">${D[order[i]].label.split(' ')[0]}</text>`).join('')}</svg>`}
function overview(){const now=D[latest],first=D[order[0]],income=order.reduce((s,k)=>s+D[k].income,0),spend=order.reduce((s,k)=>s+D[k].spend,0);return `<div class="grid4">${card('Current cash',fmt(now.end),'Checking + savings')}${card('Cash growth',fmt(now.end-first.start),'Since Nov 2025 starting balance')}${card('Income to date',fmt(income),'Across statements provided')}${card('Bank spending to date',fmt(spend),'Direct spending from bank accounts')}</div><div class="card section"><h2>Total cash balance trend</h2>${trend()}</div><div class="grid4 section">${card('401(k)','Not added','Ready for your statements')}${card('Roth IRA','Not added','Ready for your statements')}${card('Credit card debt','Not added','Need card statements')}${card('Loans','Not added','Ready for your statements')}</div>`}
function monthView(){const x=D[sel.value],cats=Object.entries(x.c).sort((a,b)=>b[1]-a[1]),mx=Math.max(...cats.map(a=>a[1]));return `<div class="grid4">${card('Starting cash',fmt(x.start))}${card('Income in',fmt(x.income))}${card('Bank spending',fmt(x.spend))}${card('Ending cash',fmt(x.end),`<span class="${x.change>=0?'positive':'negative'}">${x.change>=0?'Cash increased':'Cash decreased'} ${fmt(Math.abs(x.change))}</span>`)}</div><div class="two section"><div class="card"><h2>Where my money went</h2>${cats.map(([c,v])=>`<div class="barrow"><div>${c}</div><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><div>${fmt2(v)}</div><div class="pct muted">${(v/x.spend*100).toFixed(1)}%</div></div>`).join('')}</div><div><div class="card"><div class="label">Credit card payments</div><div class="value">${fmt(x.cards)}</div><div class="note">Kept separate until card statements are added.</div></div><div class="callout section">Transfers between your own Charter Oak accounts are excluded from spending so moving money to savings does not look like a purchase.</div></div></div>`}
function accounts(){const x=D[latest];return `<div class="two"><div class="card"><h2>Included now</h2><div class="accountrow"><span>Charter Oak accounts</span><strong>${fmt(x.end)}</strong></div><div class="note">Regular Savings, Bright Future Savings, and Debit Account are included in the current cash total.</div></div><div class="card future"><h2>Coming next</h2><div class="accountrow"><span>Credit cards</span><span class="pill">Ready to add</span></div><div class="accountrow"><span>401(k)</span><span class="pill">Ready to add</span></div><div class="accountrow"><span>Roth IRA</span><span class="pill">Ready to add</span></div><div class="accountrow"><span>Loans</span><span class="pill">Ready to add</span></div></div></div>`}
function render(){document.getElementById('app').innerHTML=view==='overview'?overview():view==='month'?monthView():accounts()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()}));
sel.addEventListener('change',render);
render();
</script>
</body></html>
